[package]
name = "damascus"
version = "0.2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
bytemuck = "1.23"
crevice = { version = "0.20", features = ["glam"] }
glam = { version = "0.33", features = ["serde"] }
image = { version = "0.25" }
indoc = "2"
itertools = { version = "0.15" }
macro_rules_attribute = { version = "0.2" }
serde = "1"
serde-hashkey = { version = "0.4.5", features = ["ordered-float"] }
serde_json_any_key = { version = "2.1" }
slotmap = { version = "1.0", features = ["serde"] }
smol = { version = "2.0" }
strum = { version = "0.27", features = ["derive"] }
wgpu = { version = "27.0" }

[dev-dependencies]
smol-macros = { version = "0.1" }
