[package]
name = "damascus_ui"
version = "0.2.0"
edition = "2024"

[dependencies]
damascus = { path = "../damascus" }

glam = { version = "0.30", features = ["serde"] }
iced_core = { version = "0.14", features = ["serde"] }
iced = { version = "0.14", features = ["default", "image", "svg"] }
# iced_aw = { version = "0.13.0", features = ["color_picker"] }
indoc = "2"
serde = "1"
serde-hashkey = { version = "0.4.5", features = ["ordered-float"] }
serde_json = "1.0"
bytemuck = "1.23"
image = { version = "0.25" }
macro_rules_attribute = { version = "0.2" }
num-traits = { version = "0.2" }
rfd = "0.15"
strum = { version = "0.27", features = ["derive"] }
#undo_2 = "0.1" # one day...
